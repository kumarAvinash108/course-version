<div class="course-version-tag" role="status" title="{{ tag_label }}">
  {%- set parts = tag_label.split(" • Version ") -%}
  {%- if parts|length == 2 -%}
    <span class="course-version-tag__name">{{ parts[0] }}</span>
    <span class="course-version-tag__sep">•</span>
    <span class="course-version-tag__version">Version {{ parts[1] }}</span>
  {%- else -%}
    <span class="course-version-tag__version">{{ tag_label }}</span>
  {%- endif -%}
</div>
